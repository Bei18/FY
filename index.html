<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>飞语 - 官方下载</title>
  
  <script>
    const CONFIG = {
      // 图标 (Logo) 的 URL
      ICO_URL: './fylogo.png',
      // Android 的 APK / 下载包 URL
      ANDROID_APK_URL: 'https://github.com/Bei18/FY/releases/download/1.0.0/FY-Android.apk'
    };

    // 动态设置 Favicon 图标
    (function setFavicons() {
      ['shortcut icon', 'icon'].forEach(rel => {
        let link = document.querySelector(`link[rel="${rel}"]`) || document.createElement('link');
        link.type = 'image/x-icon';
        link.rel = rel;
        link.href = CONFIG.ICO_URL;
        document.getElementsByTagName('head')[0].appendChild(link);
      });
    })();
  </script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "PingFang SC", "Helvetica Neue", Arial, sans-serif;
      background-color: #f1f5f9;
      background-image: 
        radial-gradient(at 10% 10%, rgba(56, 189, 248, 0.12) 0px, transparent 40%),
        radial-gradient(at 90% 90%, rgba(99, 102, 241, 0.1) 0px, transparent 40%);
      color: #0f172a;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 32px 20px;
    }

    /* 主卡片：增加层次感与柔和阴影 */
    .card {
      width: 100%;
      max-width: 380px;
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.8);
      border-radius: 32px;
      padding: 40px 28px 32px;
      text-align: center;
      box-shadow: 
        0 4px 6px -1px rgba(0, 0, 0, 0.02),
        0 20px 40px -15px rgba(14, 165, 233, 0.12);
    }

    /* App 图标区域：立体透射阴影 */
    .app-icon-wrapper {
      position: relative;
      display: inline-block;
      margin-bottom: 24px;
    }

    .app-icon-wrapper::after {
      content: '';
      position: absolute;
      top: 12px;
      left: 12px;
      right: 12px;
      bottom: -4px;
      background: #0284c7;
      filter: blur(20px);
      opacity: 0.3;
      border-radius: 24px;
      z-index: 1;
    }

    .app-icon {
      position: relative;
      z-index: 2;
      width: 92px;
      height: 92px;
      border-radius: 22px;
      object-fit: cover;
      background: #ffffff;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
      border: 1px solid rgba(226, 232, 240, 0.8);
    }

    /* 标题与副标题间距优化 */
    .app-name {
      font-size: 26px;
      font-weight: 700;
      color: #0f172a;
      letter-spacing: -0.5px;
      margin-bottom: 8px;
      line-height: 1.2;
    }

    .app-desc {
      font-size: 14px;
      color: #64748b;
      margin-bottom: 36px;
      line-height: 1.5;
      font-weight: 400;
    }

    /* 按钮样式：告别扁平，加入微渐变与精细投影 */
    .btn-group {
      display: flex;
      flex-direction: column;
      gap: 16px;
      margin-bottom: 32px;
    }

    .btn-download {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      height: 54px;
      font-size: 16px;
      font-weight: 600;
      border-radius: 18px;
      text-decoration: none;
      letter-spacing: 0.3px;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .btn-android {
      background: linear-gradient(135deg, #0ea5e9 0%, #0284c7 100%);
      color: #ffffff;
      box-shadow: 0 10px 24px -4px rgba(2, 132, 199, 0.4);
      border: 1px solid rgba(255, 255, 255, 0.2);
    }

    .btn-download:hover {
      transform: translateY(-1px);
      box-shadow: 0 12px 28px -4px rgba(2, 132, 199, 0.5);
    }

    .btn-download:active {
      transform: translateY(1px) scale(0.98);
      box-shadow: 0 6px 16px -4px rgba(2, 132, 199, 0.4);
    }

    .btn-download svg {
      width: 22px;
      height: 22px;
      fill: currentColor;
    }

    /* 安全保障提示区 */
    .security-section {
      padding-top: 24px;
      border-top: 1px dashed #e2e8f0;
    }

    .security-tags {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 20px;
      margin-bottom: 10px;
    }

    .tag-item {
      display: flex;
      align-items: center;
      gap: 4px;
      font-size: 12px;
      color: #10b981;
      font-weight: 600;
    }

    .tag-item svg {
      width: 14px;
      height: 14px;
      fill: currentColor;
    }

    .security-tips {
      font-size: 12px;
      color: #94a3b8;
      line-height: 1.5;
    }

    /* 微信遮罩层与引导视觉优化 */
    .wx-mask {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(15, 23, 42, 0.82);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      z-index: 9999;
    }

    .wx-guide-container {
      width: 100%;
      max-width: 380px;
      margin: 0 auto;
      padding: 16px 24px;
      position: relative;
    }

    .wx-arrow-pointer {
      position: absolute;
      top: 8px;
      right: 24px;
      width: 48px;
      height: 48px;
      animation: float-arrow 1.2s infinite ease-in-out;
    }

    .wx-arrow-pointer svg {
      width: 100%;
      height: 100%;
      stroke: #38bdf8;
      fill: none;
    }

    .visual-card {
      background: #ffffff;
      color: #1e293b;
      border-radius: 24px;
      padding: 28px 24px;
      margin-top: 64px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.35);
      text-align: left;
    }

    .visual-title {
      font-size: 16px;
      font-weight: 700;
      color: #0f172a;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .visual-title span {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 24px;
      height: 24px;
      background: #0284c7;
      color: #fff;
      border-radius: 50%;
      font-size: 13px;
      font-weight: 700;
    }

    .step-item {
      display: flex;
      align-items: center;
      background: #f8fafc;
      border: 1px solid #f1f5f9;
      border-radius: 16px;
      padding: 14px 16px;
      margin-bottom: 12px;
      gap: 12px;
    }

    .step-num {
      width: 24px;
      height: 24px;
      background: #e0f2fe;
      color: #0284c7;
      font-weight: 700;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      flex-shrink: 0;
    }

    .step-text {
      font-size: 14px;
      color: #334155;
      font-weight: 500;
    }

    .step-text strong {
      color: #0284c7;
    }

    .mock-browser-icon {
      width: 28px;
      height: 28px;
      background: #0284c7;
      border-radius: 8px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-left: auto;
      flex-shrink: 0;
    }

    .mock-browser-icon svg {
      width: 16px;
      height: 16px;
      fill: #ffffff;
    }

    @keyframes float-arrow {
      0%, 100% { transform: translate(0, 0); }
      50% { transform: translate(4px, -6px); }
    }
  </style>
</head>
<body>

  <!-- 主应用卡片 -->
  <div class="card">
    <div class="app-icon-wrapper">
      <img id="appLogo" src="" alt="飞语 Logo" class="app-icon">
    </div>
    
    <h1 class="app-name">飞语</h1>
    <p class="app-desc">即时通讯 · 即刻沟通</p>

    <!-- 下载按钮区域 -->
    <div class="btn-group">
      <a href="#" class="btn-download btn-android download-btn" id="androidBtn">
        <!-- Android 矢量图标 -->
        <svg viewBox="0 0 24 24">
          <path d="M6 18c0 .55.45 1 1 1h1v3c0 .55.45 1 1 1s1-.45 1-1v-3h4v3c0 .55.45 1 1 1s1-.45 1-1v-3h1c.55 0 1-.45 1-1V8H6v10zM3.5 8C2.67 8 2 8.67 2 9.5v7c0 .83.67 1.5 1.5 1.5S5 17.33 5 16.5v-7C5 8.67 4.33 8 3.5 8zm17 0c-.83 0-1.5.67-1.5 1.5v7c0 .83.67 1.5 1.5 1.5s1.5-.67 1.5-1.5v-7c0-.83-.67-1.5-1.5-1.5zm-4.97-5.84l1.3-1.3c.2-.2.2-.51 0-.71-.2-.2-.51-.2-.71 0l-1.48 1.48C13.85 1.23 12.95 1 12 1c-.96 0-1.86.23-2.66.63L7.85.15c-.2-.2-.51-.2-.71 0-.2.2-.2.51 0 .71l1.31 1.31C6.97 3.26 6 5.01 6 7h12c0-1.99-.97-3.75-2.47-4.84zM10 5H9V4h1v1zm5 0h-1V4h1v1z"/>
        </svg>
        <span>安卓版下载</span>
      </a>
    </div>

    <!-- 底部安全检测标记 -->
    <div class="security-section">
      <div class="security-tags">
        <div class="tag-item">
          <svg viewBox="0 0 24 24"><path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm-2 16l-4-4 1.41-1.41L10 14.17l6.59-6.59L18 9l-8 8z"/></svg>
          安全无毒
        </div>
        <div class="tag-item">
          <svg viewBox="0 0 24 24"><path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm-2 16l-4-4 1.41-1.41L10 14.17l6.59-6.59L18 9l-8 8z"/></svg>
          官方正版
        </div>
      </div>
      <div class="security-tips">已通过安全检测，请放心下载安装</div>
    </div>
  </div>

  <!-- 微信内置浏览器引导弹窗 -->
  <div class="wx-mask" id="wxMask">
    <div class="wx-guide-container">
      <div class="wx-arrow-pointer">
        <svg viewBox="0 0 50 50" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M 10 40 Q 30 20 42 8" />
          <path d="M 28 8 L 42 8 L 42 22" />
        </svg>
      </div>

      <div class="visual-card">
        <div class="visual-title">
          <span>i</span> 请按提示完成下载
        </div>

        <div class="step-item">
          <div class="step-num">1</div>
          <div class="step-text">点击右上角 <strong>「•••」</strong></div>
        </div>

        <div class="step-item">
          <div class="step-num">2</div>
          <div class="step-text">选择 <strong>「在浏览器打开」</strong></div>
          <div class="mock-browser-icon">
            <svg viewBox="0 0 24 24">
              <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"/>
            </svg>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    function isWeChat() {
      const urlParams = new URLSearchParams(window.location.search);
      if (urlParams.has('wx') || urlParams.has('2')) {
        return true;
      }
      return /micromessenger/i.test(navigator.userAgent);
    }

    window.addEventListener('DOMContentLoaded', () => {
      const mask = document.getElementById('wxMask');
      const appLogo = document.getElementById('appLogo');
      const androidBtn = document.getElementById('androidBtn');

      // 初始化更新链接与 Logo 地址
      if (appLogo) appLogo.src = CONFIG.ICO_URL;
      if (androidBtn) androidBtn.href = CONFIG.ANDROID_APK_URL;

      // 微信环境检测与拦截处理
      if (isWeChat()) {
        mask.style.display = 'block';

        const downloadBtns = document.querySelectorAll('.download-btn');
        downloadBtns.forEach(btn => {
          btn.addEventListener('click', (e) => {
            e.preventDefault();
            mask.style.display = 'block';
          });
        });

        mask.addEventListener('click', () => {
          mask.style.display = 'none';
        });
      }
    });
  </script>
</body>
</html>
